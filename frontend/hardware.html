<!DOCTYPE html>
<!-- Marketplace LEAF TI (substitui hardware.html e software.html): lista pública de produtos. UC12 (listar), UC13 (comprar, no detalhe),
     Solicitar doação (ONG). RN12, RN13, RN04; RNF01, RNF06; DP-68 a DP-78. Lê GET /marketplace/produtos e /marketplace/categorias.
     Qualquer pessoa vê os produtos; só usuário logado age. Cliente ONG marca vários produtos e envia uma solicitação.
     O valor só aparece para Cliente Empresa (DP-74). Desktop: 992, 1280 e 1920 px (DP-76). -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafTi - Marketplace</title>
  <link rel="shortcut icon" href="images/logosemfundo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/identidade.css">
  <link rel="stylesheet" href="css/marketplace.css">
</head>
<body class="mkt">
  <a class="pular-conteudo" href="#conteudo-mkt">Pular para o conteúdo</a>

  <header class="sticky-top border-bottom">
    <nav class="navbar navbar-expand-lg container" aria-label="Menu principal">
      <a class="navbar-brand" href="index.html"><img src="images/logosemfundo.png" alt="Logo da LEAF TI" class="logo-cabecalho"></a>
      <ul class="navbar-nav me-auto flex-row gap-3">
        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
        <li class="nav-item"><a class="nav-link active" href="hardware.html" aria-current="page">Marketplace</a></li>
        <li class="nav-item"><a class="nav-link" href="quemsomos.html">Quem somos</a></li>
      </ul>
      <div id="area-usuario"><!-- Entrar / nome / Sair: js/publico.js --></div>
    </nav>
  </header>

  <main class="container-fluid px-5 my-4" id="conteudo-mkt" tabindex="-1">
    <h1 class="h2 mb-3" id="titulo-mkt">Marketplace de equipamentos</h1>
    <div id="mensagem" class="alert d-none" aria-live="polite"></div>

    <div class="row g-4">
      <aside class="col-lg-3" aria-label="Filtros">
        <form id="form-filtros" class="painel-filtros" novalidate>
          <h2 class="h5">Filtrar produtos</h2>
          <div class="mb-3">
            <label class="form-label" for="filtro-q">Buscar por modelo</label>
            <input type="search" class="form-control" id="filtro-q" maxlength="100" autocomplete="off">
          </div>
          <div class="mb-3">
            <label class="form-label" for="filtro-categoria">Categoria</label>
            <select class="form-select" id="filtro-categoria"><option value="">Todas as categorias</option></select>
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success fw-semibold flex-fill">Filtrar</button>
            <button type="button" class="btn btn-outline-leaf fw-semibold flex-fill" id="btn-limpar">Limpar</button>
          </div>
        </form>
      </aside>

      <section class="col-lg-9" aria-labelledby="titulo-lista">
        <h2 class="h5" id="titulo-lista">Produtos disponíveis</h2>
        <p id="estado-lista" role="status">Carregando...</p>
        <div id="vazio-lista" class="cartao-mkt" hidden></div>
        <ul class="grade-mkt" id="grade" hidden></ul>
        <nav class="d-flex flex-wrap align-items-center gap-2 mb-3" aria-label="Paginação da lista" id="paginacao" hidden>
          <button type="button" class="btn btn-outline-leaf fw-semibold" id="btn-anterior">Anterior</button>
          <span id="texto-pagina" aria-live="polite"></span>
          <button type="button" class="btn btn-outline-leaf fw-semibold" id="btn-proxima">Próxima</button>
        </nav>

        <!-- Cliente ONG: solicitação com mais de um produto -->
        <section class="cartao-mkt mb-3" id="painel-solicitacao" aria-labelledby="titulo-solicitacao" hidden>
          <h2 class="h5" id="titulo-solicitacao" tabindex="-1">Revisar solicitação de doação</h2>
          <div id="msg-solicitacao" class="alert d-none" aria-live="polite"></div>
          <ul class="lista-itens-doa" id="itens-solicitacao"></ul>
          <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-success fw-semibold" id="btn-enviar-solicitacao">Enviar solicitação</button>
            <button type="button" class="btn btn-outline-leaf fw-semibold" id="btn-voltar-lista">Voltar aos produtos</button>
          </div>
        </section>
        <div class="barra-mkt" id="barra-solicitacao" hidden>
          <span id="resumo-solicitacao" aria-live="polite"></span>
          <button type="button" class="btn" id="btn-revisar">Solicitar doação</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="mkt-rodape"><div class="container">LEAF TI &middot; Informação Sustentável</div></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/publico.js"></script>
  <script src="js/marketplace.js"></script>
</body>
</html>
