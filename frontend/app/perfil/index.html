<!DOCTYPE html>
<!-- Meu perfil (pedido "cliente atualiza os próprios dados"; DP-93 a DP-99). UC02 (dados da conta, exclusão FA3/DP-64),
     UC03 (usuário da organização), UC06/UC01 (dados da organização); RN02, RN04, RN05, RN09, RNF01, RNF04, RNF05.
     Fluxo principal: editar e salvar nome/e-mail, trocar a senha, editar contato da organização.
     FE: validação no campo, 409 EMAIL_DUPLICADO, 400 DADOS_INVALIDOS, 403/404, falha de rede.
     Todos os perfis (DP-101, DP-102; Administrador e Funcionário sem seção de organização) (chave meu_perfil; a segurança real é da API). -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafTi - Meu perfil</title>
  <link rel="shortcut icon" href="../../images/logosemfundo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/identidade.css">
  <link rel="stylesheet" href="../../css/app.css">
  <link rel="stylesheet" href="../../css/usuarios.css">
  <link rel="stylesheet" href="../../css/organizacoes.css">
</head>
<body class="app">
  <a class="pular-conteudo" href="#conteudo-app">Pular para o conteúdo</a>
  <header id="app-cabecalho"></header>

  <main class="container py-4" id="conteudo-app" tabindex="-1" hidden>
    <div id="area-perfil">
      <h1 class="h2 mb-3">Meu perfil</h1>
      <div id="mensagem" class="alert d-none" aria-live="polite"></div>
      <p id="estado" role="status">Carregando...</p>

      <div class="row g-3" id="conteudo-perfil" hidden>
        <section class="col-12 col-lg-6" id="secao-conta" aria-labelledby="titulo-conta">
          <div class="cartao-app h-100">
            <h2 class="h5" id="titulo-conta">Dados da conta</h2>
            <form id="form-conta" novalidate>
              <div class="mb-3">
                <label class="form-label" for="c-nome">Nome <span aria-hidden="true">*</span></label>
                <input type="text" class="form-control" id="c-nome" maxlength="120" autocomplete="name" aria-describedby="c-nome-erro" required>
                <div id="c-nome-erro" class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="c-email">E-mail <span aria-hidden="true">*</span></label>
                <input type="email" class="form-control" id="c-email" maxlength="254" inputmode="email" autocomplete="email" aria-describedby="c-email-erro" required>
                <div id="c-email-erro" class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="c-perfil">Perfil</label>
                <input type="text" class="form-control" id="c-perfil" readonly>
              </div>
              <div class="mb-3" id="grupo-org">
                <label class="form-label" for="c-org">Organização</label>
                <input type="text" class="form-control" id="c-org" readonly>
              </div>
              <button type="submit" class="btn btn-success fw-semibold" id="btn-salvar-conta">Salvar dados da conta</button>
            </form>

            <hr class="my-4">
            <h3 class="h5" id="titulo-senha">Alterar senha</h3>
            <form id="form-senha" novalidate aria-labelledby="titulo-senha">
              <div class="mb-3">
                <label class="form-label" for="s-nova">Nova senha <span aria-hidden="true">*</span></label>
                <input type="password" class="form-control" id="s-nova" autocomplete="new-password" aria-describedby="s-nova-dica s-nova-erro" required>
                <div id="s-nova-dica" class="dica-campo">De 8 a 128 caracteres.</div>
                <div id="s-nova-erro" class="invalid-feedback"></div>
              </div>
              <button type="submit" class="btn btn-success fw-semibold" id="btn-alterar-senha">Alterar senha</button>
            </form>
          </div>
        </section>

        <section class="col-12 col-lg-6" id="secao-org" aria-labelledby="titulo-org">
          <div class="cartao-app h-100">
            <h2 class="h5" id="titulo-org">Dados da organização</h2>
            <form id="form-org" novalidate>
              <div class="mb-3">
                <label class="form-label" for="o-nome">Nome ou razão social <span aria-hidden="true">*</span></label>
                <input type="text" class="form-control" id="o-nome" maxlength="150" aria-describedby="o-nome-erro" required>
                <div id="o-nome-erro" class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="o-telefone">Telefone <span aria-hidden="true">*</span></label>
                <input type="tel" class="form-control" id="o-telefone" maxlength="20" inputmode="tel" autocomplete="tel" aria-describedby="o-telefone-erro" required>
                <div id="o-telefone-erro" class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="o-email">E-mail da organização <span aria-hidden="true">*</span></label>
                <input type="email" class="form-control" id="o-email" maxlength="254" inputmode="email" aria-describedby="o-email-erro" required>
                <div id="o-email-erro" class="invalid-feedback"></div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="o-endereco">Endereço <span aria-hidden="true">*</span></label>
                <input type="text" class="form-control" id="o-endereco" maxlength="255" autocomplete="street-address" aria-describedby="o-endereco-erro" required>
                <div id="o-endereco-erro" class="invalid-feedback"></div>
              </div>
              <div class="row g-3 mb-2">
                <div class="col-12 col-sm-6"><label class="form-label" for="o-cnpj">CNPJ</label><input type="text" class="form-control" id="o-cnpj" readonly></div>
                <div class="col-12 col-sm-6"><label class="form-label" for="o-tipo">Tipo</label><input type="text" class="form-control" id="o-tipo" readonly></div>
                <div class="col-12 col-sm-6"><label class="form-label" for="o-situacao">Situação</label><input type="text" class="form-control" id="o-situacao" readonly></div>
              </div>
              <p class="dica-campo">Para alterar CNPJ, tipo ou situação, fale com o Administrador.</p>
              <button type="submit" class="btn btn-success fw-semibold" id="btn-salvar-org">Salvar dados da organização</button>
            </form>
          </div>
        </section>

        <section class="col-12" id="secao-excluir" aria-labelledby="titulo-excluir">
          <div class="cartao-app">
            <h2 class="h5" id="titulo-excluir">Excluir minha conta</h2>
            <p>A exclusão é definitiva e exige a sua senha atual.</p>
            <button type="button" class="btn btn-outline-leaf fw-semibold" id="btn-excluir-conta-perfil">Excluir minha conta</button>
          </div>
        </section>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">LEAF TI &middot; Informação Sustentável</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/layout.js"></script>
  <script src="../../js/usuarios-comum.js"></script>
  <script src="../../js/organizacoes-comum.js"></script>
  <script src="../../js/senha-olho.js"></script>
  <script src="../../js/perfil.js"></script>
</body>
</html>
