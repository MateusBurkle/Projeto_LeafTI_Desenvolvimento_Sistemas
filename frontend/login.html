<!DOCTYPE html>
<!-- UC04 Acessar o sistema (inclui UC28 Validar credenciais); RF01, RN01, RNF03, RNF04, RNF05.
     Fluxo principal: informar e-mail e senha e selecionar Entrar.
     FE1 credenciais inválidas e FE2 conta/organização inativa: mensagem na tela, sem iniciar sessão. -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeafTi - Entrar</title>
  <link rel="shortcut icon" href="images/logosemfundo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/identidade.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="tela-login">
  <a class="pular-conteudo" href="#conteudo-login">Pular para o conteúdo</a>

  <main id="conteudo-login" tabindex="-1" class="container d-flex justify-content-center py-4">
    <div class="cartao-login">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h2 m-0">Entrar</h1>
        <a href="index.html" class="link-logo" aria-label="Voltar à página inicial">
          <img src="images/logosemfundo.png" alt="Logo da LEAF TI" class="logo-cabecalho">
        </a>
      </div>

      <div id="aviso" class="alert alert-danger d-none" role="alert" tabindex="-1"></div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="email">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="username"
                 inputmode="email" maxlength="254" placeholder="seu@email.com.br"
                 aria-describedby="email-erro" required>
          <div id="email-erro" class="invalid-feedback"></div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="senha">Senha</label>
          <input type="password" class="form-control" id="senha" name="senha" autocomplete="current-password"
                 maxlength="128" placeholder="Digite sua senha" aria-describedby="senha-erro" required>
          <div id="senha-erro" class="invalid-feedback"></div>
        </div>

        <!-- RF01: o login não cadastra. Contas são criadas pelo Administrador (UC02) ou por um cliente da organização (UC03). -->
        <p class="mb-4 aviso-acesso">Não tem conta? Peça seu acesso ao administrador.</p>

        <button type="submit" id="btn-entrar" class="btn btn-success w-100 py-2 fw-semibold">Entrar</button>
      </form>
    </div>
  </main>

  <script src="js/senha-olho.js"></script>
  <script src="js/api.js"></script>
  <script src="js/publico.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
