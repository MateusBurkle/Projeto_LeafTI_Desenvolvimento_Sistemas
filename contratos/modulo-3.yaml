# MODELO (DP-87): coluna criada por DDL no back-end (ALTER TABLE EQUIPAMENTO ADD COLUMN imagem TEXT NULL, só se ainda não existir), sem editar
# banco/Codigo_Modelo_Fisico.sql. EQUIPAMENTO.imagem TEXT NULL = apenas o NOME do arquivo (<uuid4 hex 32>.<jpg|png|webp>); NULL = sem imagem.
# Resposta Equipamento (GET/POST/PUT): acrescenta `imagem` (string|null) e `imagem_url` (string|null, "/imagens/equipamentos/<nome>").
# Armazenamento (DP-86): pasta <raiz do projeto>/armazenamento/imagens/equipamentos/ (variável LEAF_IMAGENS_DIR; fora de backend/app e de frontend/),
# criada na inicialização; entra no .gitignore. Excluir equipamento (se vier a existir) apaga o arquivo; desativar mantém.
