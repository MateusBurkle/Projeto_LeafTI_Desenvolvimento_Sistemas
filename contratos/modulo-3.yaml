  PUT   /categorias/{id}: [Administrador]
  PATCH /categorias/{id}/situacao: [Administrador]
  GET   /equipamentos: [Administrador, Funcionário]
  POST  /equipamentos: [Administrador, Funcionário]
  GET   /equipamentos/{id}: [Administrador, Funcionário]
  PUT   /equipamentos/{id}: [Administrador, Funcionário]
  PATCH /equipamentos/{id}/situacao: [Administrador, Funcionário]
  PATCH /equipamentos/{id}/ativo: [Administrador, Funcionário]
