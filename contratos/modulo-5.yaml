# Esclarecimentos do coordenador (sem mudar regra; 2026-10-31):
# 1) Confirmar com data_venda anterior à data do pedido -> 400 DADOS_INVALIDOS (campos.data_venda), checado depois de 404 e de VENDA_NAO_PENDENTE.
# 2) VENDA_INCONSISTENTE (UC16 FE2): venda sem itens, item com valor <= 0 ou não finito, ou soma dos itens diferente do valor_total (tolerância 0,005).
# 3) Confirmar venda já 'Confirmada' com dados diferentes -> 422 VENDA_NAO_PENDENTE; com os mesmos dados -> 200.
# 4) PUT /vendas/{id}/itens não revalida os itens já presentes (a confirmação revalida tudo).
# 5) Pedido 'Cancelada' volta com itens [], quantidade 0 e valor_total 0 (linhas de ITEM_VENDA apagadas, DP-45).
# 6) Erro de validação de ids_equipamento vem como 400 com a chave 'ids_equipamento' (sem índice).
# 7) Download da nota envia também X-Content-Type-Options: nosniff e CSP restritiva (segurança, sem mudar regra).
